plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.alipaysandbox'
version = '1.0.0'

android {
  namespace 'expo.modules.alipaysandbox'
  defaultConfig { versionCode 1; versionName '1.0.0' }
}

dependencies {
  implementation 'com.alipay.sdk:alipaysdk-android:15.8.42@aar'
}
